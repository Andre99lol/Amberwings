<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmberWings - Vetrina</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- ============================================================
       FIREBASE - SDK
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script>
    // ============================================================
    // CONFIGURAZIONE FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAsMApyZ7qFSsc0tc8mjwjjk1lFI0F-IlE",
      authDomain: "amberwings.firebaseapp.com",
      projectId: "amberwings",
      storageBucket: "amberwings.firebasestorage.app",
      messagingSenderId: "506946836664",
      appId: "1:506946836664:web:82ef31285dceea39903c4d",
      measurementId: "G-8G4N0VMDJR"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Per debug - mostra se Firebase è inizializzato
    console.log('✅ Firebase inizializzato');
  </script>
</head>
<body>

<header>
  <h1>🦋 AmberWings</h1>
  <nav>
    <a href="admin.html" id="adminLink">🔐 Area Privata</a>
  </nav>
</header>

<section class="hero">
  <h2>✨ I nostri prodotti</h2>
  <p>Scopri la collezione AmberWings</p>
</section>

<section class="products">
  <div id="productList" class="product-grid">
    <div class="loading">⏳ Caricamento prodotti...</div>
  </div>
</section>

<footer>&copy; 2025 AmberWings - Tutti i diritti riservati</footer>

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const COLLECTION_NAME = 'prodotti';
  const SESSION_KEY = 'loggedIn';

  // ============================================================
  // CARICA PRODOTTI DA FIREBASE
  // ============================================================
  async function loadProducts() {
    const productList = document.getElementById('productList');
    
    try {
      console.log('📥 Caricamento prodotti da Firebase...');
      
      // Carica i dati da Firebase
      const snapshot = await db.collection(COLLECTION_NAME).get();
      
      console.log('📦 Documenti trovati:', snapshot.size);
      
      if (snapshot.empty) {
        console.log('⚠️ Nessun documento trovato');
        productList.innerHTML = `
          <div class="no-products">
            <p>📦 Nessun prodotto disponibile al momento.</p>
            <p style="font-size:14px;color:#999;margin-top:10px;">
              Vai all'<a href="admin.html" style="color:#667eea;">Area Privata</a> per aggiungere prodotti.
            </p>
          </div>
        `;
        return;
      }
      
      const products = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        console.log(`📄 Documento ${doc.id}:`, data);
        products.push({
          ...data,
          firebaseId: doc.id
        });
      });
      
      console.log(`✅ Caricati ${products.length} prodotti`);
      
      // Mostra i prodotti
      if (products.length === 0) {
        productList.innerHTML = `
          <div class="no-products">
            <p>📦 Nessun prodotto disponibile al momento.</p>
          </div>
        `;
        return;
      }
      
      productList.innerHTML = products.map(product => `
        <div class="product-card">
          ${product.image ? `<img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.display='none'" />` : ''}
          <div class="product-info">
            <h3>${escapeHtml(product.name)}</h3>
            ${product.description ? `<p class="product-description">${escapeHtml(product.description)}</p>` : ''}
            <p class="product-price">€ ${Number(product.price).toFixed(2)}</p>
          </div>
        </div>
      `).join('');
      
      // Salva in cache per eventuale uso offline
      localStorage.setItem('shopItemsCache', JSON.stringify(products));
      
    } catch (error) {
      console.error('❌ Errore caricamento prodotti:', error);
      console.error('Dettaglio errore:', error.message);
      
      // Prova a caricare dalla cache
      const cached = localStorage.getItem('shopItemsCache');
      if (cached) {
        console.log('📦 Usando dati in cache');
        try {
          const products = JSON.parse(cached);
          productList.innerHTML = products.map(product => `
            <div class="product-card">
              ${product.image ? `<img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.display='none'" />` : ''}
              <div class="product-info">
                <h3>${escapeHtml(product.name)}</h3>
                ${product.description ? `<p class="product-description">${escapeHtml(product.description)}</p>` : ''}
                <p class="product-price">€ ${Number(product.price).toFixed(2)}</p>
              </div>
            </div>
          `).join('');
          return;
        } catch (e) {
          console.error('❌ Errore nel parsing della cache:', e);
        }
      }
      
      productList.innerHTML = `
        <div class="error">
          <p>❌ Impossibile caricare i prodotti.</p>
          <p style="font-size:14px;color:#999;margin-top:10px;">
            Errore: ${error.message}
          </p>
          <p style="font-size:14px;color:#999;margin-top:10px;">
            Verifica che le <strong>regole di Firebase</strong> siano configurate correttamente.
          </p>
        </div>
      `;
    }
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // MOSTRA/NASCONDI LINK ADMIN
  // ============================================================
  function checkAdminAccess() {
    const adminLink = document.getElementById('adminLink');
    if (localStorage.getItem(SESSION_KEY) === 'true') {
      adminLink.style.display = 'inline-block';
    } else {
      adminLink.style.display = 'none';
    }
  }

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Pagina caricata, avvio loadProducts()...');
    loadProducts();
    checkAdminAccess();
  });
</script>
</body>
</html>
