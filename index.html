<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vetrina</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- ============================================================

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script>
    // ============================================================
    // CONFIGURAZIONE FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAsMApyZ7qFSsc0tc8mjwjjk1lFI0F-IlE",
      authDomain: "amberwings.firebaseapp.com",
      projectId: "amberwings",
      storageBucket: "amberwings.firebasestorage.app",
      messagingSenderId: "506946836664",
      appId: "1:506946836664:web:82ef31285dceea39903c4d",
      measurementId: "G-8G4N0VMDJR"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log('✅ Firebase inizializzato');
  </script>
</head>
<body>

<header>
  <h1>
    <img src="icona.jpeg" alt="Icona" class="header-icon" />
    I nostri articoli
  </h1>
  <nav>
    <a href="login.html">Area Privata</a>
  </nav>
</header>

<!-- Sezione contatti -->
<div class="section">
  <div class="controls">
    <a href="https://www.paypal.me/teamamberwings/" target="_blank" class="paypal-btn" id="PaypalBtn">
      <i class="fab fa-paypal" style="margin-right:8px;"></i>
      Paga con Paypal
    </a>

    <a href="https://www.facebook.com/people/Amber-Wings/61576399365300/" target="_blank" class="facebook-btn" id="FacebookBtn">
      <i class="fab fa-facebook" style="margin-right:8px;"></i>
      Seguici su Facebook
    </a>

    <a href="https://www.instagram.com/amberwings3d/" target="_blank" class="instagram-btn" id="InstagramBtn">
      <i class="fab fa-instagram" style="margin-right:8px;"></i>
      Seguici su Instagram
    </a>
    
    <button id="sendWhatsAppBtn">
      <i class="fab fa-whatsapp" style="margin-right:8px;"></i>
      Contattaci su WhatsApp
    </button>
    
    <span id="selectedCount">0 articoli selezionati</span>
  </div>
</div>

<!-- Griglia delle card -->
<div class="grid" id="vetrinaGrid"></div>

<footer>&copy; Barons & Coec</footer>

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const COLLECTION_NAME = 'prodotti';
  const SESSION_KEY = 'loggedIn';
  const STORAGE_KEY = 'shopItems';

  // ============================================================
  // DEFINIZIONE MATERIALI E COLORI (TUTTO ORIGINALE)
  // ============================================================
  const MATERIALS = {
    'PLA+': {
      colors: ['Bianco', 'Marmo', 'Beige', 'Giallo', 'Arancione', 'Rosa', 'Rosso', 'Viola', 'Verde Acqua', 'Verde', 'Azzurro', 'Blu', 'Grigio', 'Marrone', 'Nero', 'Oro', 'Argento', 'Bronzo']
    },
    'TPU': {
      colors: ['Bianco TPU']
    }
  };

  const COLOR_DOTS = {
    'Bianco': '#ffffff',
    'Marmo': '#E7E9EA',
    'Beige': '#F5F5DC',
    'Giallo': '#f1c40f',
    'Arancione': '#e67e22',
    'Rosa': '#fd79a8',
    'Rosso': '#e74c3c',
    'Viola': '#9b59b6',
    'Verde Acqua': '#1abc9c',
    'Verde': '#27ae60',
    'Azzurro': '#3498db',
    'Blu': '#2980b9',
    'Grigio': '#95a5a6',
    'Marrone': '#8B4513',
    'Nero': '#000000',
    'Oro': '#FFD700',
    'Argento': '#C0C0C0',
    'Bronzo': '#CD7F32',
    'Bianco TPU': '#FFFFFF'
  };

  // ============================================================
  // CARICAMENTO ARTICOLI DA FIREBASE (INVECE DI JSONBIN)
  // ============================================================
  async function loadItems() {
    try {
      console.log('📥 Caricamento da Firebase...');
      
      const snapshot = await db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').get();
      const items = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        items.push({
          ...data,
          firebaseId: doc.id
        });
      });
      
      console.log(`✅ Caricati ${items.length} prodotti da Firebase`);
      
      // Salva in cache locale
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      
      return items;
    } catch (error) {
      console.error('❌ Errore caricamento:', error);
      
      // Prova a caricare dalla cache
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        console.log('📦 Usando dati in cache');
        try {
          return JSON.parse(cached);
        } catch (e) {
          console.error('❌ Errore parsing cache:', e);
          return [];
        }
      }
      return [];
    }
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // TOGGLE LISTA COLORI
  // ============================================================
  function toggleColors(itemId) {
    const list = document.querySelector(`.color-list[data-id="${itemId}"]`);
    const toggleBtn = document.querySelector(`.color-toggle[data-id="${itemId}"]`);
    
    if (list) {
      list.classList.toggle('open');
      
      if (toggleBtn) {
        toggleBtn.classList.toggle('open');
        const isOpen = list.classList.contains('open');
        toggleBtn.innerHTML = isOpen ? 
          '🎨 Nascondi colori <i class="fas fa-chevron-up"></i>' : 
          '🎨 Scegli colori <i class="fas fa-chevron-down"></i>';
      }
    }
  }

  // ============================================================
  // TOGGLE SELEZIONE CARD
  // ============================================================
  function toggleCardSelection(itemId) {
    const card = document.querySelector(`.card[data-id="${itemId}"]`);
    const checkbox = document.querySelector(`#check-${itemId}`);
    
    if (card && checkbox) {
      checkbox.checked = !checkbox.checked;
      
      if (checkbox.checked) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
      
      updateSelectedCount();
    }
  }

  // ============================================================
  // RENDER VETRINA
  // ============================================================
  async function render() {
    const items = await loadItems();
    const grid = document.getElementById('vetrinaGrid');

    if (items.length === 0) {
      grid.innerHTML = '<p style="text-align:center;padding:40px;color:#666;">Nessun articolo disponibile.</p>';
      return;
    }

    grid.innerHTML = items.map((item, index) => {
      const isChecked = document.querySelector(`#check-${item.id}`)?.checked || false;
      const selectedMaterial = item.material || '';
      const availableColors = selectedMaterial ? MATERIALS[selectedMaterial]?.colors || [] : [];
      const selectedColors = item.colors || [];
      
      return `
      <div class="card ${isChecked ? 'selected' : ''}" data-id="${item.id}" onclick="toggleCardSelection(${item.id})">
        <input type="checkbox" id="check-${item.id}" class="item-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''} style="display:none;" />
        <h2>${escapeHtml(item.name)}</h2>
        <p>${escapeHtml(item.description || '')}</p>
        ${Number(item.price) > 0 ? `<p class="price">€ ${Number(item.price).toFixed(2)}</p>` : ''}
        
        <!-- Selezione Materiale (sola lettura) -->
        <div style="margin-top:8px;font-size:0.9rem;color:#2c3e50;">
          <strong>Materiale:</strong> ${selectedMaterial || 'Non specificato'}
        </div>
        
        <!-- Colori selezionati -->
        ${selectedColors.length > 0 ? `
          <div style="margin-top:4px;font-size:0.85rem;color:#2c3e50;">
            <strong>Colori:</strong>
            <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
              ${selectedColors.map(color => `
                <span style="display:inline-flex;align-items:center;gap:4px;background:#f0f0f0;padding:2px 8px;border-radius:12px;font-size:0.75rem;">
                  <span class="color-dot" style="width:10px;height:10px;background:${COLOR_DOTS[color] || '#ccc'};border:1px solid ${color === 'Bianco' || color === 'Marmo' || color === 'Bianco TPU' ? '#ccc' : 'transparent'};"></span>
                  ${color}
                </span>
              `).join('')}
            </div>
          </div>
        ` : `<div style="margin-top:4px;font-size:0.85rem;color:#999;">Nessun colore selezionato</div>`}
        
        ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}">` : ''}
      </div>
    `}).join('');

    // ----- EVENTI CHECKBOX SELEZIONE ARTICOLO -----
    document.querySelectorAll('.item-checkbox').forEach(cb => {
      cb.addEventListener('change', function(e) {
        e.stopPropagation();
        const card = this.closest('.card');
        if (this.checked) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
        updateSelectedCount();
      });
    });

    updateSelectedCount();
  }

  // ============================================================
  // CONTATORE ARTICOLI SELEZIONATI
  // ============================================================
  function updateSelectedCount() {
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    const countEl = document.getElementById('selectedCount');
    if (countEl) {
      countEl.textContent = `${checkboxes.length} articoli selezionati`;
    }
  }

  // ============================================================
  // FUNZIONE DI UTILITÀ: CONVERTE IMMAGINE (URL O BASE64) IN FILE
  // ============================================================
  async function urlToFile(imageSrc, filename = 'articolo.jpg') {
    try {
      const response = await fetch(imageSrc);
      const blob = await response.blob();
      const mimeType = blob.type || 'image/jpeg';
      return new File([blob], filename, { type: mimeType });
    } catch (e) {
      console.error("Impossibile convertire l'immagine in file:", e);
      return null;
    }
  }

  // ============================================================
  // INVIO WHATSAPP CON IMMAGINE (WEB SHARE API + FALLBACK)
  // ============================================================
  document.getElementById('sendWhatsAppBtn').addEventListener('click', async () => {
    const phone = '393470376110';
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    const items = await loadItems();
    
    // Se non c'è nessun articolo selezionato, invia messaggio generico via link wa.me
    if (checkboxes.length === 0) {
      const message = '> *Buondì, vorrei ricevere maggiori informazioni sui vostri articoli.*\n\nPotreste gentilmente fornirmi:\n- Disponibilità\n- Tempi di consegna\n- Costi di spedizione\nBuona giornata!';
      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
      return;
    }

    const selectedItems = [];
    checkboxes.forEach(cb => {
      const id = parseInt(cb.dataset.id);
      const item = items.find(i => i.id === id);
      if (item) selectedItems.push(item);
    });

    // Prepara il testo del messaggio
    let message = 'Chiedo gentilmente informazioni per questi articoli:\n\n';
    selectedItems.forEach((item) => {
      const material = item.material || 'Materiale non specificato';
      const colors = item.colors || [];
      const colorText = colors.length > 0 ? ` (Colori: ${colors.join(', ')})` : '';
      
      message += `• ${item.name} - Materiale: ${material}${colorText}\n`;
      if (item.price) message += `  Prezzo: € ${Number(item.price).toFixed(2)}\n`;
      if (item.description) message += `  Note: ${item.description}\n`;
      message += '\n';
    });
    message += 'Grazie!';

    // Cerchiamo la prima immagine valida tra gli articoli selezionati
    const itemWithImage = selectedItems.find(i => i.image && i.image.trim() !== '');
    let imageFile = null;

    if (itemWithImage) {
      imageFile = await urlToFile(itemWithImage.image, `${itemWithImage.name.replace(/\s+/g, '_')}.jpg`);
    }

    // Prova ad usare la Web Share API se supportata dal dispositivo
    if (imageFile && navigator.canShare && navigator.canShare({ files: [imageFile] })) {
      try {
        await navigator.share({
          title: 'Info Articoli',
          text: message,
          files: [imageFile]
        });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn('Errore durante la condivisione nativa, provo con fallback wa.me', err);
      }
    }

    // FALLBACK: usa il classico link WhatsApp
    let fallbackMessage = '> _*Chiedo gentilmente informazioni per questi articoli*_:\n\n';
    selectedItems.forEach((item) => {
      const material = item.material || 'Materiale non specificato';
      const colors = item.colors || [];
      const colorText = colors.length > 0 ? ` (Colori: ${colors.join(', ')})` : '';
      
      fallbackMessage += `• ${item.name} - Materiale: ${material}${colorText}\n`;
      if (item.price) fallbackMessage += `  💰 € ${Number(item.price).toFixed(2)}\n`;
      if (item.description) fallbackMessage += `  📝 ${item.description}\n`;
      if (item.image) fallbackMessage += `  🖼️ ${item.image}\n`;
      fallbackMessage += '\n';
    });
    fallbackMessage += 'Grazie!';

    const encodedMessage = encodeURIComponent(fallbackMessage);
    window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
  });

  // ============================================================
  // INIZIALIZZA - Ascolta aggiornamenti dall'admin
  // ============================================================
  document.addEventListener('DOMContentLoaded', render);

  // Ascolta aggiornamenti dal localStorage (quando l'admin salva)
  window.addEventListener('storage', (e) => {
    if (e.key === 'shopItemsUpdated' || e.key === STORAGE_KEY) {
      render();
    }
  });

  // Ricarica ogni 30 secondi per sincronizzare
  setInterval(() => {
    render();
  }, 30000);
</script>
</body>
</html>
