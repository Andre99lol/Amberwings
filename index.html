<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vetrina</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- ============================================================
       FIREBASE - SDK
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script>
    // ============================================================
    // CONFIGURAZIONE FIREBASE
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAsMApyZ7qFSsc0tc8mjwjjk1lFI0F-IlE",
      authDomain: "amberwings.firebaseapp.com",
      projectId: "amberwings",
      storageBucket: "amberwings.firebasestorage.app",
      messagingSenderId: "506946836664",
      appId: "1:506946836664:web:82ef31285dceea39903c4d",
      measurementId: "G-8G4N0VMDJR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log('✅ Firebase inizializzato');
  </script>
</head>
<body>

<header>
  <h1>
    <img src="icona.jpeg" alt="Icona" class="header-icon" />
    I nostri articoli
  </h1>
  <nav>
    <a href="login.html">Area Privata</a>
  </nav>
</header>

<!-- Sezione contatti -->
<div class="section">
  <div class="controls">
    <a href="https://www.paypal.me/teamamberwings/" target="_blank" class="paypal-btn" id="PaypalBtn">
      <i class="fab fa-paypal" style="margin-right:8px;"></i>
      Paga con Paypal
    </a>

    <a href="https://www.facebook.com/people/Amber-Wings/61576399365300/" target="_blank" class="facebook-btn" id="FacebookBtn">
      <i class="fab fa-facebook" style="margin-right:8px;"></i>
      Seguici su Facebook
    </a>

    <a href="https://www.instagram.com/amberwings3d/" target="_blank" class="instagram-btn" id="InstagramBtn">
      <i class="fab fa-instagram" style="margin-right:8px;"></i>
      Seguici su Instagram
    </a>
    
    <button id="sendWhatsAppBtn">
      <i class="fab fa-whatsapp" style="margin-right:8px;"></i>
      Contattaci su WhatsApp
    </button>
    
    <span id="selectedCount">0 articoli selezionati</span>
  </div>
</div>

<!-- Griglia delle card -->
<div class="grid" id="vetrinaGrid"></div>

<footer>&copy; Barons & Coec</footer>

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const COLLECTION_NAME = 'prodotti';
  const STORAGE_KEY = 'shopItems';

  // ============================================================
  // DEFINIZIONE MATERIALI E COLORI (PER IL CLIENTE)
  // ============================================================
  const MATERIALS = {
    'PLA+': {
      colors: ['Bianco', 'Marmo', 'Beige', 'Giallo', 'Arancione', 'Rosa', 'Rosso', 'Viola', 'Verde Acqua', 'Verde', 'Azzurro', 'Blu', 'Grigio', 'Marrone', 'Nero', 'Oro', 'Argento', 'Bronzo']
    },
    'TPU': {
      colors: ['Bianco TPU']
    }
  };

  const COLOR_DOTS = {
    'Bianco': '#ffffff',
    'Marmo': '#E7E9EA',
    'Beige': '#F5F5DC',
    'Giallo': '#f1c40f',
    'Arancione': '#e67e22',
    'Rosa': '#fd79a8',
    'Rosso': '#e74c3c',
    'Viola': '#9b59b6',
    'Verde Acqua': '#1abc9c',
    'Verde': '#27ae60',
    'Azzurro': '#3498db',
    'Blu': '#2980b9',
    'Grigio': '#95a5a6',
    'Marrone': '#8B4513',
    'Nero': '#000000',
    'Oro': '#FFD700',
    'Argento': '#C0C0C0',
    'Bronzo': '#CD7F32',
    'Bianco TPU': '#FFFFFF'
  };

  // ============================================================
  // CARICAMENTO ARTICOLI DA FIREBASE
  // ============================================================
  async function loadItems() {
    try {
      console.log('📥 Caricamento da Firebase...');
      
      const snapshot = await db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').get();
      const items = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        items.push({
          ...data,
          firebaseId: doc.id,
          id: doc.id
        });
      });
      
      console.log(`✅ Caricati ${items.length} prodotti da Firebase`);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      return items;
    } catch (error) {
      console.error('❌ Errore caricamento:', error);
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        console.log('📦 Usando dati in cache');
        try {
          return JSON.parse(cached);
        } catch (e) {
          console.error('❌ Errore parsing cache:', e);
          return [];
        }
      }
      return [];
    }
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // TOGGLE MATERIALE (per il cliente)
  // ============================================================
  function toggleMaterial(itemId, event) {
    if (event) event.stopPropagation();
    
    const dropdown = document.querySelector(`#material-${itemId}`);
    const container = document.querySelector(`#colorContainer-${itemId}`);
    const selectedMaterial = dropdown.value;
    
    if (selectedMaterial && MATERIALS[selectedMaterial]) {
      // Mostra il container dei colori
      container.style.display = 'block';
      
      // Genera i checkbox per i colori
      const colors = MATERIALS[selectedMaterial].colors;
      const colorCheckboxes = document.querySelector(`#colorCheckboxes-${itemId}`);
      
      colorCheckboxes.innerHTML = colors.map(color => `
        <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:#f0f0f0;padding:2px 10px;border-radius:16px;border:2px solid #ddd;transition:all 0.3s;font-size:0.75rem;">
          <input type="checkbox" value="${color}" style="display:none;" />
          <span class="color-dot" style="width:12px;height:12px;border-radius:50%;background:${COLOR_DOTS[color] || '#ccc'};border:1px solid ${color === 'Bianco' || color === 'Marmo' || color === 'Bianco TPU' ? '#ccc' : 'transparent'};display:inline-block;"></span>
          ${color}
        </label>
      `).join('');

      // Event listener per i checkbox colori
      colorCheckboxes.querySelectorAll('label').forEach(label => {
        const checkbox = label.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', function() {
          if (this.checked) {
            label.style.borderColor = '#27ae60';
            label.style.background = '#e8f8f0';
          } else {
            label.style.borderColor = '#ddd';
            label.style.background = '#f0f0f0';
          }
        });
      });
      
    } else {
      container.style.display = 'none';
    }
  }

  // ============================================================
  // TOGGLE SELEZIONE CARD (MULTIPLA)
  // ============================================================
  function toggleCardSelection(itemId, event) {
    if (event) {
      event.stopPropagation();
      event.preventDefault();
    }
    
    console.log(`🔄 Toggle selezione per ID: ${itemId}`);
    
    const card = document.querySelector(`.card[data-id="${itemId}"]`);
    const checkbox = document.querySelector(`#check-${itemId}`);
    
    if (!card || !checkbox) {
      console.warn(`⚠️ Card o checkbox non trovati per ID: ${itemId}`);
      return;
    }
    
    checkbox.checked = !checkbox.checked;
    
    if (checkbox.checked) {
      card.classList.add('selected');
    } else {
      card.classList.remove('selected');
    }
    
    updateSelectedCount();
  }

  // ============================================================
  // RENDER VETRINA (con selezione materiale e colori per il cliente)
  // ============================================================
  async function render() {
    const items = await loadItems();
    const grid = document.getElementById('vetrinaGrid');

    if (items.length === 0) {
      grid.innerHTML = '<p style="text-align:center;padding:40px;color:#666;">Nessun articolo disponibile.</p>';
      return;
    }

    grid.innerHTML = items.map((item) => {
      const itemId = item.id;
      const isChecked = document.querySelector(`#check-${itemId}`)?.checked || false;
      
      return `
      <div class="card ${isChecked ? 'selected' : ''}" data-id="${itemId}">
        <input type="checkbox" id="check-${itemId}" class="item-checkbox" data-id="${itemId}" ${isChecked ? 'checked' : ''} style="display:none;" />
        
        <!-- Clicca sulla card per selezionare/deselezionare -->
        <div onclick="toggleCardSelection('${itemId}', event)" style="cursor:pointer;">
          <h2>${escapeHtml(item.name)}</h2>
          <p>${escapeHtml(item.description || '')}</p>
          ${Number(item.price) > 0 ? `<p class="price">€ ${Number(item.price).toFixed(2)}</p>` : ''}
          ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}">` : ''}
        </div>
        
        <!-- SELEZIONE MATERIALE (per il cliente) -->
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee;">
          <label style="font-size:0.85rem;font-weight:bold;display:block;margin-bottom:4px;">Scegli materiale:</label>
          <select id="material-${itemId}" onchange="toggleMaterial('${itemId}', event)" style="width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:0.85rem;">
            <option value="">Seleziona...</option>
            <option value="PLA+">PLA+</option>
            <option value="TPU">TPU</option>
          </select>
        </div>
        
        <!-- SELEZIONE COLORI (per il cliente) -->
        <div id="colorContainer-${itemId}" style="display:none;margin-top:8px;">
          <label style="font-size:0.8rem;font-weight:bold;display:block;margin-bottom:4px;">Scegli colori:</label>
          <div id="colorCheckboxes-${itemId}" style="display:flex;flex-wrap:wrap;gap:4px;"></div>
          <small style="display:block;margin-top:4px;font-size:0.7rem;color:#888;">Seleziona uno o più colori</small>
        </div>
      </div>
    `}).join('');

    // Eventi checkbox selezione articolo
    document.querySelectorAll('.item-checkbox').forEach(cb => {
      cb.addEventListener('change', function(e) {
        e.stopPropagation();
        const card = this.closest('.card');
        if (this.checked) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
        updateSelectedCount();
      });
    });

    updateSelectedCount();
  }

  // ============================================================
  // CONTATORE ARTICOLI SELEZIONATI
  // ============================================================
  function updateSelectedCount() {
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    const countEl = document.getElementById('selectedCount');
    if (countEl) {
      countEl.textContent = `${checkboxes.length} articoli selezionati`;
    }
  }

  // ============================================================
  // FUNZIONE DI UTILITÀ: CONVERTE IMMAGINE IN FILE
  // ============================================================
  async function urlToFile(imageSrc, filename = 'articolo.jpg') {
    try {
      const response = await fetch(imageSrc);
      const blob = await response.blob();
      const mimeType = blob.type || 'image/jpeg';
      return new File([blob], filename, { type: mimeType });
    } catch (e) {
      console.error("Impossibile convertire l'immagine in file:", e);
      return null;
    }
  }

  // ============================================================
  // INVIO WHATSAPP CON TUTTI GLI ARTICOLI SELEZIONATI
  // ============================================================
  document.getElementById('sendWhatsAppBtn').addEventListener('click', async () => {
    const phone = '393470376110';
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    const items = await loadItems();
    
    if (checkboxes.length === 0) {
      const message = '> *Buondì, vorrei ricevere maggiori informazioni sui vostri articoli.*\n\nPotreste gentilmente fornirmi:\n- Disponibilità\n- Tempi di consegna\n- Costi di spedizione\nBuona giornata!';
      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
      return;
    }

    // Raccogli tutti gli articoli selezionati con materiali e colori scelti dal cliente
    const selectedItems = [];
    checkboxes.forEach(cb => {
      const id = cb.dataset.id;
      const item = items.find(i => i.id === id);
      if (item) {
        // Leggi il materiale scelto dal cliente
        const materialDropdown = document.querySelector(`#material-${id}`);
        const selectedMaterial = materialDropdown ? materialDropdown.value : '';
        
        // Leggi i colori scelti dal cliente
        const colorCheckboxes = document.querySelectorAll(`#colorCheckboxes-${id} input[type="checkbox"]:checked`);
        const selectedColors = Array.from(colorCheckboxes).map(cb => cb.value);
        
        selectedItems.push({
          ...item,
          clienteMateriale: selectedMaterial,
          clienteColori: selectedColors
        });
      }
    });

    if (selectedItems.length === 0) {
      alert('Nessun articolo valido selezionato!');
      return;
    }

    // ============================================================
    // TESTO DEL MESSAGGIO CON MATERIALI E COLORI SCELTI DAL CLIENTE
    // ============================================================
    let message = '🦋 *Richiesta informazioni AmberWings* 🦋\n\n';
    message += 'Salve, vorrei ricevere informazioni sui seguenti articoli:\n\n';
    
    selectedItems.forEach((item) => {
      const material = item.clienteMateriale || 'Non selezionato';
      const colors = item.clienteColori || [];
      const colorText = colors.length > 0 ? ` (Colori: ${colors.join(', ')})` : ' (Nessun colore selezionato)';
      
      message += `📦 *${item.name}*\n`;
      message += `  🔧 Materiale: ${material}${colorText}\n`;
      if (item.price) message += `  💰 Prezzo: € ${Number(item.price).toFixed(2)}\n`;
      if (item.description) message += `  📝 Note: ${item.description}\n`;
      message += '\n';
    });
    message += 'Grazie mille! 🙏';

    // Cerchiamo la prima immagine valida
    const itemWithImage = selectedItems.find(i => i.image && i.image.trim() !== '');
    let imageFile = null;

    if (itemWithImage) {
      imageFile = await urlToFile(itemWithImage.image, `${itemWithImage.name.replace(/\s+/g, '_')}.jpg`);
    }

    // Prova ad usare la Web Share API
    if (imageFile && navigator.canShare && navigator.canShare({ files: [imageFile] })) {
      try {
        await navigator.share({
          title: 'Info Articoli AmberWings',
          text: message,
          files: [imageFile]
        });
        return;
      } catch (err) {
        if (err.name === 'AbortError') return;
        console.warn('Errore condivisione nativa, uso fallback', err);
      }
    }

    // FALLBACK: link WhatsApp
    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
  });

  // ============================================================
  // INIZIALIZZA
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Avvio render...');
    render();
  });

  window.addEventListener('storage', (e) => {
    if (e.key === 'shopItemsUpdated' || e.key === STORAGE_KEY) {
      console.log('🔄 Aggiornamento rilevato, ricarico...');
      render();
    }
  });

  setInterval(() => {
    console.log('⏰ Refresh automatico...');
    render();
  }, 30000);
</script>
</body>
</html>
