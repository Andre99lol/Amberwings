<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Privata</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<header>
  <h1>🔐 Area Privata</h1>
  <nav>
    <a href="index.html">Vetrina</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<section class="form-section">
  <h2 id="formTitle">➕ Aggiungi nuovo articolo</h2>
  <form id="addForm">
    <input type="hidden" id="editId" value="" />
    <input type="text" id="name" placeholder="Nome *" required />
    <input type="text" id="description" placeholder="Descrizione" />
    <input type="number" id="price" placeholder="Prezzo" step="0.01" />
    
    <!-- Materiale -->
    <div>
      <label style="font-weight:600;display:block;margin-bottom:4px;">
        Materiale <span class="required-label">*</span>
      </label>
      <select id="material" required>
        <option value="">-- Scegli materiale --</option>
        <option value="PLA+">PLA+</option>
        <option value="TPU">TPU</option>
      </select>
    </div>
    
    <!-- Colori -->
    <div>
      <label style="font-weight:600;display:block;margin-bottom:4px;">
        Colori disponibili <span class="required-label">*</span> <small>(max 2)</small>
      </label>
      <div id="colorCheckboxes" class="color-checkboxes-group">
        <span style="color:#999;width:100%;text-align:center;padding:8px;">
          Seleziona un materiale per vedere i colori
        </span>
      </div>
    </div>
    
    <input type="file" id="image" accept="image/*" />
    <small style="display:block; margin-bottom:12px; color:#888;">
      Carica un'immagine (lascia vuoto per mantenere quella esistente)
    </small>
    <div id="imagePreview" style="margin-top:8px;"></div>
    <div id="uploadStatus" style="margin-top:8px; color:#666;"></div>
    
    <button type="submit" id="submitBtn">➕ Aggiungi</button>
    <button type="button" id="cancelBtn" style="display:none; background:#666;">❌ Annulla</button>
  </form>
  <div id="message"></div>
</section>

<section class="list-section">
  <h2>📦 Articoli esistenti</h2>
  <div id="syncStatus">🔄 Sincronizzazione in corso...</div>
  <ul id="itemList"></ul>
</section>

<footer>&copy; 2025 - Gestione articoli</footer>

<script>
  // ============================================================
  // CONFIGURAZIONE JSONBIN
  // ============================================================
  const JSONBIN_API_KEY = 'IL_TUO_API_KEY'; // ← INSERISCI IL TUO API KEY
  const JSONBIN_BIN_ID = 'IL_TUO_BIN_ID';   // ← INSERISCI IL TUO BIN ID
  
  // ============================================================
  // CONFIGURAZIONE CLOUDINARY
  // ============================================================
  const CLOUDINARY_CLOUD_NAME = 't6qrribf';
  const CLOUDINARY_UPLOAD_PRESET = 'Amberwings';
  const SESSION_KEY = 'loggedIn';

  // ============================================================
  // DEFINIZIONE MATERIALI E COLORI (uguale a index.html)
  // ============================================================
  const MATERIALS = {
    'PLA+': {
      colors: ['Bianco', 'Marmo', 'Beige', 'Giallo', 'Arancione', 'Rosa', 'Rosso', 'Viola', 'Verde Acqua', 'Verde', 'Azzurro', 'Blu', 'Grigio', 'Marrone', 'Nero', 'Oro', 'Argento', 'Bronzo']
    },
    'TPU': {
      colors: ['Bianco TPU']
    }
  };

  const COLOR_DOTS = {
    'Bianco': '#ffffff',
    'Marmo': '#E7E9EA',
    'Beige': '#F5F5DC',
    'Giallo': '#f1c40f',
    'Arancione': '#e67e22',
    'Rosa': '#fd79a8',
    'Rosso': '#e74c3c',
    'Viola': '#9b59b6',
    'Verde Acqua': '#1abc9c',
    'Verde': '#27ae60',
    'Azzurro': '#3498db',
    'Blu': '#2980b9',
    'Grigio': '#95a5a6',
    'Marrone': '#8B4513',
    'Nero': '#000000',
    'Oro': '#FFD700',
    'Argento': '#C0C0C0',
    'Bronzo': '#CD7F32',
    'Bianco TPU': '#FFFFFF'
  };

  // ============================================================
  // PROTEGGI PAGINA
  // ============================================================
  if (localStorage.getItem(SESSION_KEY) !== 'true') {
    window.location.href = 'login.html';
  }

  // ============================================================
  // FUNZIONI DATI (SALVA SU JSONBIN)
  // ============================================================
  async function loadItems() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: {
          'X-Master-Key': JSONBIN_API_KEY
        }
      });
      const data = await response.json();
      return data.record || [];
    } catch (error) {
      console.error('Errore caricamento:', error);
      setStatus('❌ Errore caricamento dati', 'error');
      return [];
    }
  }

  async function saveItems(items) {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(items)
      });
      if (!response.ok) throw new Error('Errore salvataggio');
      setStatus(`✅ ${items.length} articoli salvati su cloud`, 'success');
      
      // Notifica la vetrina che i dati sono cambiati
      localStorage.setItem('shopItemsUpdated', Date.now().toString());
      
      return await response.json();
    } catch (error) {
      console.error('Errore salvataggio:', error);
      setStatus('❌ Errore salvataggio', 'error');
      throw error;
    }
  }

  // ============================================================
  // STATUS
  // ============================================================
  function setStatus(msg, type) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg;
    if (type === 'success') {
      el.style.background = '#e8f8f0';
      el.style.color = '#27ae60';
    } else if (type === 'error') {
      el.style.background = '#fde8e8';
      el.style.color = '#e74c3c';
    } else {
      el.style.background = '#f8f9fa';
      el.style.color = '#666';
    }
  }

  // ============================================================
  // CARICA IMMAGINE SU CLOUDINARY
  // ============================================================
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

    try {
      const response = await fetch(url, { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Errore nel caricamento su Cloudinary');
      const data = await response.json();
      return data.secure_url;
    } catch (error) {
      console.error('Errore upload:', error);
      throw error;
    }
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // GENERA CHECKBOX COLORI
  // ============================================================
  function generateColorCheckboxes(selectedMaterial, selectedColors = []) {
    const container = document.getElementById('colorCheckboxes');
    if (!selectedMaterial || !MATERIALS[selectedMaterial]) {
      container.innerHTML = `
        <span style="color:#999;width:100%;text-align:center;padding:8px;">
          Seleziona un materiale per vedere i colori
        </span>
      `;
      return;
    }
    
    const availableColors = MATERIALS[selectedMaterial].colors || [];
    
    container.innerHTML = availableColors.map(color => {
      const isSelected = selectedColors.includes(color);
      const dotColor = COLOR_DOTS[color] || '#ccc';
      const isWhite = color === 'Bianco' || color === 'Marmo' || color === 'Bianco TPU';
      return `
        <label class="${isSelected ? 'selected' : ''}">
          <input type="checkbox" class="color-checkbox" value="${color}" ${isSelected ? 'checked' : ''} />
          <span class="color-dot" style="background:${dotColor};border-color:${isWhite ? '#ccc' : 'transparent'};"></span>
          ${color}
        </label>
      `;
    }).join('');
    
    // Aggiungi controllo max 2 colori
    document.querySelectorAll('.color-checkbox').forEach(cb => {
      cb.addEventListener('change', function() {
        const checked = document.querySelectorAll('.color-checkbox:checked');
        if (this.checked && checked.length > 2) {
          alert('⚠️ Puoi selezionare massimo 2 colori.');
          this.checked = false;
          return;
        }
        // Aggiorna stile label
        const label = this.closest('label');
        if (this.checked) {
          label.classList.add('selected');
        } else {
          label.classList.remove('selected');
        }
      });
    });
  }

  // ============================================================
  // RENDER LISTA ADMIN
  // ============================================================
  function renderList(items) {
    const list = document.getElementById('itemList');
    if (!items || items.length === 0) {
      list.innerHTML = '<li style="text-align:center;color:#999;padding:20px;">Nessun articolo presente.</li>';
      return;
    }
    list.innerHTML = items.map(item => `
      <li data-id="${item.id}">
        <div class="item-info">
          <strong>${escapeHtml(item.name)}</strong> – € ${Number(item.price).toFixed(2)}
          <div style="font-size:0.85rem;color:#666;margin-top:2px;">
            Materiale: ${item.material || 'Non specificato'}
          </div>
          ${item.colors && item.colors.length > 0 ? `
            <div class="item-colors">
              ${item.colors.map(color => `
                <span>
                  <span class="color-dot-small" style="background:${COLOR_DOTS[color] || '#ccc'};border-color:${color === 'Bianco' || color === 'Marmo' || color === 'Bianco TPU' ? '#ccc' : 'transparent'};"></span>
                  ${color}
                </span>
              `).join('')}
            </div>
          ` : '<div style="font-size:0.8rem;color:#999;">Nessun colore</div>'}
          ${item.image ? `<img src="${escapeHtml(item.image)}" style="max-width:40px;max-height:40px;border-radius:4px;margin-top:4px;">` : ''}
        </div>
        <div class="item-actions">
          <button class="edit-btn" data-id="${item.id}" style="background:#2196F3;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">✏️ Modifica</button>
          <button class="delete-btn" data-id="${item.id}" style="background:#f44336;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">🗑️ Rimuovi</button>
        </div>
      </li>
    `).join('');

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = parseInt(this.dataset.id);
        editItem(id);
      });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = parseInt(this.dataset.id);
        removeItem(id);
      });
    });
  }

  // ============================================================
  // CARICA DATI ALL'AVVIO
  // ============================================================
  async function loadData() {
    setStatus('⏳ Caricamento in corso...', '');
    try {
      const items = await loadItems();
      renderList(items);
      setStatus(`✅ ${items.length} articoli caricati dal cloud`, 'success');
    } catch (e) {
      setStatus('❌ Errore caricamento', 'error');
      renderList([]);
    }
  }

  // ============================================================
  // MODIFICA ARTICOLO
  // ============================================================
  let currentItems = [];

  async function editItem(id) {
    const items = await loadItems();
    currentItems = items;
    const item = items.find(i => i.id === id);
    if (!item) { alert('Articolo non trovato!'); return; }

    document.getElementById('editId').value = item.id;
    document.getElementById('name').value = item.name;
    document.getElementById('description').value = item.description || '';
    document.getElementById('price').value = item.price;
    
    // Imposta il materiale
    const materialSelect = document.getElementById('material');
    if (item.material) {
      materialSelect.value = item.material;
    } else {
      materialSelect.value = '';
    }
    
    // Genera i colori
    if (item.material) {
      generateColorCheckboxes(item.material, item.colors || []);
    } else {
      document.getElementById('colorCheckboxes').innerHTML = `
        <span style="color:#999;width:100%;text-align:center;padding:8px;">
          Seleziona un materiale per vedere i colori
        </span>
      `;
    }
    
    // Preview immagine
    const preview = document.getElementById('imagePreview');
    if (item.image) {
      preview.innerHTML = `
        <div>
          <p style="font-size:12px;color:#666;margin-bottom:4px;">Immagine attuale:</p>
          <img src="${escapeHtml(item.image)}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
          <p style="font-size:11px;color:#999;margin-top:4px;">Carica una nuova immagine per sostituirla</p>
        </div>
      `;
    } else {
      preview.innerHTML = '';
    }

    document.getElementById('formTitle').textContent = '✏️ Modifica articolo';
    document.getElementById('submitBtn').textContent = '💾 Salva modifiche';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
    document.getElementById('uploadStatus').textContent = '';
    document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
  }

  // ============================================================
  // ANNULLA MODIFICA
  // ============================================================
  function cancelEdit() {
    document.getElementById('addForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('colorCheckboxes').innerHTML = `
      <span style="color:#999;width:100%;text-align:center;padding:8px;">
        Seleziona un materiale per vedere i colori
      </span>
    `;
    document.getElementById('formTitle').textContent = '➕ Aggiungi nuovo articolo';
    document.getElementById('submitBtn').textContent = '➕ Aggiungi';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
    document.getElementById('material').value = '';
  }

  // ============================================================
  // RIMUOVI ARTICOLO
  // ============================================================
  async function removeItem(id) {
    if (!confirm('Rimuovere questo articolo?')) return;
    let items = await loadItems();
    items = items.filter(item => item.id !== id);
    await saveItems(items);
    renderList(items);
    cancelEdit();
  }

  // ============================================================
  // GESTIONE CAMBIO MATERIALE
  // ============================================================
  document.getElementById('material').addEventListener('change', function() {
    const selectedMaterial = this.value;
    const editId = document.getElementById('editId').value;
    let selectedColors = [];
    
    if (editId) {
      // Se stai modificando, carica i colori esistenti
      loadItems().then(items => {
        const item = items.find(i => i.id === parseInt(editId));
        if (item) selectedColors = item.colors || [];
        generateColorCheckboxes(selectedMaterial, selectedColors);
      });
    } else {
      generateColorCheckboxes(selectedMaterial, []);
    }
  });

  // ============================================================
  // AGGIUNGI/MODIFICA ARTICOLO
  // ============================================================
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const editId = document.getElementById('editId').value;
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    const price = parseFloat(document.getElementById('price').value) || 0;
    const material = document.getElementById('material').value;
    const fileInput = document.getElementById('image');
    const file = fileInput.files[0];
    const statusDiv = document.getElementById('uploadStatus');
    const messageDiv = document.getElementById('message');

    // Prendi i colori selezionati
    const selectedColors = Array.from(document.querySelectorAll('.color-checkbox:checked'))
      .map(cb => cb.value);

    // Validazioni
    if (!name) {
      messageDiv.textContent = '❌ Nome obbligatorio.';
      messageDiv.className = 'error';
      return;
    }

    if (!material) {
      messageDiv.textContent = '❌ Seleziona un materiale.';
      messageDiv.className = 'error';
      return;
    }

    if (selectedColors.length === 0) {
      messageDiv.textContent = '❌ Seleziona almeno un colore.';
      messageDiv.className = 'error';
      return;
    }

    let imageUrl = '';

    if (file) {
      statusDiv.textContent = '⏳ Caricamento su Cloudinary...';
      statusDiv.style.color = '#ff9800';
      try {
        imageUrl = await uploadToCloudinary(file);
        statusDiv.textContent = '✅ Immagine caricata!';
        statusDiv.style.color = '#4caf50';
      } catch (error) {
        messageDiv.textContent = '❌ Errore nel caricamento: ' + error.message;
        messageDiv.className = 'error';
        statusDiv.textContent = '';
        return;
      }
    }

    let items = await loadItems();

    if (editId) {
      // Modifica articolo esistente
      const index = items.findIndex(i => i.id === parseInt(editId));
      if (index === -1) {
        messageDiv.textContent = '❌ Articolo non trovato!';
        messageDiv.className = 'error';
        return;
      }
      items[index].name = name;
      items[index].description = description || '';
      items[index].price = price;
      items[index].material = material;
      items[index].colors = selectedColors;
      if (imageUrl) items[index].image = imageUrl;
      messageDiv.textContent = '✅ Articolo modificato!';
      messageDiv.className = 'success';
    } else {
      // Nuovo articolo
      const newItem = {
        id: items.length > 0 ? Math.max(...items.map(i => i.id)) + 1 : 1,
        name,
        description: description || '',
        price: price,
        material: material,
        colors: selectedColors,
        image: imageUrl
      };
      items.push(newItem);
      messageDiv.textContent = '✅ Articolo aggiunto!';
      messageDiv.className = 'success';
    }

    await saveItems(items);
    renderList(items);
    cancelEdit();
    document.getElementById('addForm').reset();
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('colorCheckboxes').innerHTML = `
      <span style="color:#999;width:100%;text-align:center;padding:8px;">
        Seleziona un materiale per vedere i colori
      </span>
    `;
    statusDiv.textContent = '';
    
    // Ricarica la vetrina (se aperta)
    localStorage.setItem('shopItemsUpdated', Date.now().toString());
  });

  // ============================================================
  // ANTEPRIMA IMMAGINE
  // ============================================================
  document.getElementById('image').addEventListener('change', (e) => {
    const preview = document.getElementById('imagePreview');
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        preview.innerHTML = `
          <div>
            <p style="font-size:12px;color:#666;margin-bottom:4px;">Nuova immagine:</p>
            <img src="${ev.target.result}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
            <p style="font-size:11px;color:#999;margin-top:4px;">Sostituirà l'immagine esistente</p>
          </div>
        `;
      };
      reader.readAsDataURL(file);
    } else {
      // Se l'utente ha deselezionato il file, mostra l'immagine esistente se in modifica
      const editId = document.getElementById('editId').value;
      if (editId) {
        loadItems().then(items => {
          const item = items.find(i => i.id === parseInt(editId));
          if (item && item.image) {
            preview.innerHTML = `
              <div>
                <p style="font-size:12px;color:#666;margin-bottom:4px;">Immagine attuale:</p>
                <img src="${escapeHtml(item.image)}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
              </div>
            `;
          } else {
            preview.innerHTML = '';
          }
        });
      } else {
        preview.innerHTML = '';
      }
    }
  });

  // ============================================================
  // PULSANTE ANNULLA
  // ============================================================
  document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

  // ============================================================
  // LOGOUT
  // ============================================================
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem(SESSION_KEY);
    window.location.href = 'index.html';
  });

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
