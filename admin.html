<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Privata</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- ============================================================
       FIREBASE - SDK
       ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsMApyZ7qFSsc0tc8mjwjjk1lFI0F-IlE",
      authDomain: "amberwings.firebaseapp.com",
      projectId: "amberwings",
      storageBucket: "amberwings.firebasestorage.app",
      messagingSenderId: "506946836664",
      appId: "1:506946836664:web:82ef31285dceea39903c4d",
      measurementId: "G-8G4N0VMDJR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log('✅ Firebase inizializzato');
  </script>
</head>
<body>

<header>
  <h1>🔐 Area Privata</h1>
  <nav>
    <a href="index.html">Vetrina</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<section class="form-section">
  <h2 id="formTitle">➕ Aggiungi nuovo articolo</h2>
  <form id="addForm">
    <input type="hidden" id="editFirebaseId" value="" />
    <input type="text" id="name" placeholder="Nome *" required />
    <input type="text" id="description" placeholder="Descrizione" />
    <input type="number" id="price" placeholder="Prezzo" step="0.01" />
    
    <input type="file" id="image" accept="image/*" />
    <small style="display:block; margin-bottom:12px; color:#888;">
      Carica un'immagine (lascia vuoto per mantenere quella esistente)
    </small>
    <div id="imagePreview" style="margin-top:8px;"></div>
    <div id="uploadStatus" style="margin-top:8px; color:#666;"></div>
    
    <button type="submit" id="submitBtn">➕ Aggiungi</button>
    <button type="button" id="cancelBtn" style="display:none; background:#666;">❌ Annulla</button>
  </form>
  <div id="message"></div>
</section>

<section class="list-section">
  <h2>📦 Articoli esistenti</h2>
  <div id="syncStatus">🔄 Sincronizzazione in corso...</div>
  <ul id="itemList"></ul>
</section>

<footer>&copy; 2025 - Gestione articoli</footer>

<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  const CLOUDINARY_CLOUD_NAME = 't6qrribf';
  const CLOUDINARY_UPLOAD_PRESET = 'Amberwings';
  const SESSION_KEY = 'loggedIn';
  const COLLECTION_NAME = 'prodotti';

  // ============================================================
  // FUNZIONI DATI (FIREBASE)
  // ============================================================
  
  async function loadItems() {
    try {
      console.log('📥 Caricamento da Firebase...');
      
      const snapshot = await db.collection(COLLECTION_NAME).orderBy('createdAt', 'desc').get();
      const items = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        items.push({
          ...data,
          firebaseId: doc.id,
          id: doc.id
        });
      });
      
      localStorage.setItem('shopItemsCache', JSON.stringify(items));
      console.log(`✅ Caricati ${items.length} prodotti da Firebase`);
      return items;
    } catch (error) {
      console.error('❌ Errore caricamento:', error);
      setStatus('❌ Errore caricamento dati', 'error');
      const cached = localStorage.getItem('shopItemsCache');
      if (cached) {
        console.log('📦 Usando dati in cache');
        return JSON.parse(cached);
      }
      return [];
    }
  }

  async function addItem(itemData) {
    try {
      console.log('➕ Aggiungo articolo...');
      const { firebaseId, id, ...cleanData } = itemData;
      const newItem = {
        ...cleanData,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      const docRef = await db.collection(COLLECTION_NAME).add(newItem);
      console.log(`✅ Articolo aggiunto con ID: ${docRef.id}`);
      return { ...newItem, firebaseId: docRef.id, id: docRef.id };
    } catch (error) {
      console.error('❌ Errore aggiunta:', error);
      throw error;
    }
  }

  async function updateItem(firebaseId, itemData) {
    try {
      console.log(`✏️ Aggiorno articolo ${firebaseId}...`);
      const { firebaseId: _, id, ...cleanData } = itemData;
      await db.collection(COLLECTION_NAME).doc(firebaseId).update({
        ...cleanData,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      console.log(`✅ Articolo ${firebaseId} aggiornato`);
      return { ...cleanData, firebaseId, id: firebaseId };
    } catch (error) {
      console.error('❌ Errore aggiornamento:', error);
      throw error;
    }
  }

  async function deleteItem(firebaseId) {
    try {
      console.log(`🗑️ Elimino articolo ${firebaseId}...`);
      await db.collection(COLLECTION_NAME).doc(firebaseId).delete();
      console.log(`✅ Articolo ${firebaseId} eliminato`);
    } catch (error) {
      console.error('❌ Errore eliminazione:', error);
      throw error;
    }
  }

  // ============================================================
  // STATUS
  // ============================================================
  function setStatus(msg, type) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.textContent = msg;
    el.style.background = type === 'success' ? '#e8f8f0' : type === 'error' ? '#fde8e8' : '#f8f9fa';
    el.style.color = type === 'success' ? '#27ae60' : type === 'error' ? '#e74c3c' : '#666';
  }

  // ============================================================
  // CARICA IMMAGINE SU CLOUDINARY
  // ============================================================
  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;

    try {
      const response = await fetch(url, { method: 'POST', body: formData });
      if (!response.ok) throw new Error('Errore nel caricamento su Cloudinary');
      const data = await response.json();
      return data.secure_url;
    } catch (error) {
      console.error('Errore upload:', error);
      throw error;
    }
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // RENDER LISTA ADMIN
  // ============================================================
  function renderList(items) {
    const list = document.getElementById('itemList');
    if (!list) return;
    
    if (!items || items.length === 0) {
      list.innerHTML = '<li style="text-align:center;color:#999;padding:20px;">Nessun articolo presente.</li>';
      return;
    }
    
    list.innerHTML = items.map(item => `
      <li data-firebase-id="${item.firebaseId}">
        <div class="item-info">
          <strong>${escapeHtml(item.name)}</strong> – € ${Number(item.price).toFixed(2)}
          ${item.image ? `<img src="${escapeHtml(item.image)}" style="max-width:40px;max-height:40px;border-radius:4px;margin-top:4px;margin-left:10px;">` : ''}
        </div>
        <div class="item-actions">
          <button class="edit-btn" data-firebase-id="${item.firebaseId}" style="background:#2196F3;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">✏️ Modifica</button>
          <button class="delete-btn" data-firebase-id="${item.firebaseId}" style="background:#f44336;color:white;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;">🗑️ Rimuovi</button>
        </div>
      </li>
    `).join('');

    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const firebaseId = this.dataset.firebaseId;
        editItem(firebaseId);
      });
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const firebaseId = this.dataset.firebaseId;
        removeItem(firebaseId);
      });
    });
  }

  // ============================================================
  // CARICA DATI ALL'AVVIO
  // ============================================================
  async function loadData() {
    setStatus('⏳ Caricamento in corso...', '');
    try {
      const items = await loadItems();
      renderList(items);
      setStatus(`✅ ${items.length} articoli caricati da Firebase`, 'success');
    } catch (e) {
      setStatus('❌ Errore caricamento', 'error');
      renderList([]);
    }
  }

  // ============================================================
  // MODIFICA ARTICOLO
  // ============================================================
  async function editItem(firebaseId) {
    const items = await loadItems();
    const item = items.find(i => i.firebaseId === firebaseId);
    if (!item) { 
      alert('Articolo non trovato!'); 
      return; 
    }

    document.getElementById('editFirebaseId').value = firebaseId;
    document.getElementById('name').value = item.name;
    document.getElementById('description').value = item.description || '';
    document.getElementById('price').value = item.price;
    
    const preview = document.getElementById('imagePreview');
    if (item.image) {
      preview.innerHTML = `
        <div>
          <p style="font-size:12px;color:#666;margin-bottom:4px;">Immagine attuale:</p>
          <img src="${escapeHtml(item.image)}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
          <p style="font-size:11px;color:#999;margin-top:4px;">Carica una nuova immagine per sostituirla</p>
        </div>
      `;
    } else {
      preview.innerHTML = '';
    }

    document.getElementById('formTitle').textContent = '✏️ Modifica articolo';
    document.getElementById('submitBtn').textContent = '💾 Salva modifiche';
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
    document.getElementById('uploadStatus').textContent = '';
    document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
  }

  // ============================================================
  // ANNULLA MODIFICA
  // ============================================================
  function cancelEdit() {
    document.getElementById('addForm').reset();
    document.getElementById('editFirebaseId').value = '';
    document.getElementById('imagePreview').innerHTML = '';
    document.getElementById('uploadStatus').textContent = '';
    document.getElementById('formTitle').textContent = '➕ Aggiungi nuovo articolo';
    document.getElementById('submitBtn').textContent = '➕ Aggiungi';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('message').textContent = '';
    document.getElementById('message').className = '';
  }

  // ============================================================
  // RIMUOVI ARTICOLO
  // ============================================================
  async function removeItem(firebaseId) {
    if (!confirm('Rimuovere questo articolo?')) return;
    
    try {
      await deleteItem(firebaseId);
      const items = await loadItems();
      renderList(items);
      cancelEdit();
      setStatus(`✅ Articolo eliminato con successo`, 'success');
      localStorage.setItem('shopItemsUpdated', Date.now().toString());
    } catch (error) {
      setStatus(`❌ Errore nell'eliminazione: ${error.message}`, 'error');
    }
  }

  // ============================================================
  // AGGIUNGI/MODIFICA ARTICOLO
  // ============================================================
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const firebaseId = document.getElementById('editFirebaseId').value;
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    const price = parseFloat(document.getElementById('price').value) || 0;
    const fileInput = document.getElementById('image');
    const file = fileInput.files[0];
    const statusDiv = document.getElementById('uploadStatus');
    const messageDiv = document.getElementById('message');

    if (!name) {
      messageDiv.textContent = '❌ Nome obbligatorio.';
      messageDiv.className = 'error';
      return;
    }

    let imageUrl = '';

    if (file) {
      statusDiv.textContent = '⏳ Caricamento su Cloudinary...';
      statusDiv.style.color = '#ff9800';
      try {
        imageUrl = await uploadToCloudinary(file);
        statusDiv.textContent = '✅ Immagine caricata!';
        statusDiv.style.color = '#4caf50';
      } catch (error) {
        messageDiv.textContent = '❌ Errore nel caricamento: ' + error.message;
        messageDiv.className = 'error';
        statusDiv.textContent = '';
        return;
      }
    }

    try {
      let items = await loadItems();
      
      if (firebaseId) {
        const existingItem = items.find(i => i.firebaseId === firebaseId);
        if (!existingItem) {
          messageDiv.textContent = '❌ Articolo non trovato!';
          messageDiv.className = 'error';
          return;
        }
        
        const updatedData = {
          name: name,
          description: description || '',
          price: price,
          image: imageUrl || existingItem.image || ''
        };
        
        await updateItem(firebaseId, updatedData);
        messageDiv.textContent = '✅ Articolo modificato con successo!';
        messageDiv.className = 'success';
        
      } else {
        const newItemData = {
          name: name,
          description: description || '',
          price: price,
          image: imageUrl || ''
        };
        
        await addItem(newItemData);
        messageDiv.textContent = `✅ Articolo aggiunto con successo!`;
        messageDiv.className = 'success';
      }

      const updatedItems = await loadItems();
      renderList(updatedItems);
      cancelEdit();
      
      document.getElementById('addForm').reset();
      document.getElementById('imagePreview').innerHTML = '';
      statusDiv.textContent = '';
      
      localStorage.setItem('shopItemsUpdated', Date.now().toString());
      
    } catch (error) {
      messageDiv.textContent = `❌ Errore: ${error.message}`;
      messageDiv.className = 'error';
      console.error('Errore nel submit:', error);
    }
  });

  // ============================================================
  // ANTEPRIMA IMMAGINE
  // ============================================================
  document.getElementById('image').addEventListener('change', (e) => {
    const preview = document.getElementById('imagePreview');
    const file = e.target.files[0];
    
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        preview.innerHTML = `
          <div>
            <p style="font-size:12px;color:#666;margin-bottom:4px;">Nuova immagine:</p>
            <img src="${ev.target.result}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
            <p style="font-size:11px;color:#999;margin-top:4px;">Sostituirà l'immagine esistente</p>
          </div>
        `;
      };
      reader.readAsDataURL(file);
    } else {
      const firebaseId = document.getElementById('editFirebaseId').value;
      if (firebaseId) {
        loadItems().then(items => {
          const item = items.find(i => i.firebaseId === firebaseId);
          if (item && item.image) {
            preview.innerHTML = `
              <div>
                <p style="font-size:12px;color:#666;margin-bottom:4px;">Immagine attuale:</p>
                <img src="${escapeHtml(item.image)}" style="max-width:100px; max-height:100px; border-radius:8px; border:1px solid #ddd; padding:4px;">
              </div>
            `;
          } else {
            preview.innerHTML = '';
          }
        });
      } else {
        preview.innerHTML = '';
      }
    }
  });

  // ============================================================
  // PULSANTE ANNULLA
  // ============================================================
  document.getElementById('cancelBtn').addEventListener('click', cancelEdit);

  // ============================================================
  // LOGOUT
  // ============================================================
  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem(SESSION_KEY);
    window.location.href = 'index.html';
  });

  // ============================================================
  // PROTEGGI PAGINA
  // ============================================================
  if (localStorage.getItem(SESSION_KEY) !== 'true') {
    window.location.href = 'login.html';
  }

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
