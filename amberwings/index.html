<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vetrina</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

<header>
  <h1>
    <img src="icona.jpeg" alt="Icona" class="header-icon" />
    I nostri articoli
  </h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Area Privata</a>
  </nav>
</header>

<!-- Sezione contatti -->
<div class="section">
  <div class="controls">
    <a href="https://www.paypal.me/teamamberwings/" target="_blank" class="paypal-btn" id="PaypalBtn">
      <i class="fab fa-paypal" style="margin-right:8px;"></i>
      Paga con Paypal
    </a>

    <a href="https://www.facebook.com/people/Amber-Wings/61576399365300/" target="_blank" class="facebook-btn" id="FacebookBtn">
      <i class="fab fa-facebook" style="margin-right:8px;"></i>
      Seguici su Facebook
    </a>

    <a href="https://www.instagram.com/teamamberwings/" target="_blank" class="instagram-btn" id="InstagramBtn">
      <i class="fab fa-instagram" style="margin-right:8px;"></i>
      Seguici su Instagram
    </a>
    
    <button id="sendWhatsAppBtn">
      <i class="fab fa-whatsapp" style="margin-right:8px;"></i>
      Contattaci su WhatsApp
    </button>
  </div>
</div>

<!-- Griglia delle card -->
<div class="grid" id="vetrinaGrid"></div>

<footer>&copy; Barons & Coec</footer>

<script>
  const STORAGE_KEY = 'shopItems';

  // ============================================================
  // CARICAMENTO ARTICOLI
  // ============================================================
  function loadItems() {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? JSON.parse(stored) : [];
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  // ============================================================
  // ESCAPE HTML
  // ============================================================
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================
  // SALVA COLORI NEL LOCALSTORAGE
  // ============================================================
  function saveColors(itemId) {
    const items = loadItems();
    const item = items.find(i => i.id === itemId);
    if (!item) return;
    
    const colorCheckboxes = document.querySelectorAll(`.color-checkbox[data-id="${itemId}"]`);
    const selectedColors = Array.from(colorCheckboxes)
      .filter(cb => cb.checked)
      .map(cb => cb.value);
    
    item.colors = selectedColors;
    saveItems(items);
  }

  // ============================================================
  // TOGGLE LISTA COLORI
  // ============================================================
  function toggleColors(itemId) {
    const list = document.querySelector(`.color-list[data-id="${itemId}"]`);
    const toggleBtn = document.querySelector(`.color-toggle[data-id="${itemId}"]`);
    
    if (list) {
      list.classList.toggle('open');
      
      if (list.classList.contains('open')) {
        list.style.display = 'flex';
      } else {
        list.style.display = 'none';
      }
      
      if (toggleBtn) {
        toggleBtn.classList.toggle('open');
        const isOpen = list.classList.contains('open');
        toggleBtn.innerHTML = isOpen ? 
          '🎨 Nascondi colori <i class="fas fa-chevron-up"></i>' : 
          '🎨 Scegli colori <i class="fas fa-chevron-down"></i>';
      }
    }
  }

  // ============================================================
  // TOGGLE SELEZIONE CARD
  // ============================================================
  function toggleCardSelection(itemId) {
    const card = document.querySelector(`.card[data-id="${itemId}"]`);
    const checkbox = document.querySelector(`#check-${itemId}`);
    
    if (card && checkbox) {
      checkbox.checked = !checkbox.checked;
      
      if (checkbox.checked) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
      
      updateSelectedCount();
    }
  }

  // ============================================================
  // RENDER VETRINA
  // ============================================================
  function render() {
    const items = loadItems();
    const grid = document.getElementById('vetrinaGrid');

    if (items.length === 0) {
      grid.innerHTML = '<p>Nessun articolo disponibile.</p>';
      return;
    }

    grid.innerHTML = items.map((item, index) => {
      const colors = item.colors || [];
      const isChecked = document.querySelector(`#check-${item.id}`)?.checked || false;
      
      return `
      <div class="card ${isChecked ? 'selected' : ''}" data-id="${item.id}" onclick="toggleCardSelection(${item.id})">
        <input type="checkbox" id="check-${item.id}" class="item-checkbox" data-id="${item.id}" ${isChecked ? 'checked' : ''} style="display:none;" />
        <h2>${escapeHtml(item.name)}</h2>
        <p>${escapeHtml(item.description || '')}</p>
        ${Number(item.price) > 0 ? `<p class="price">€ ${Number(item.price).toFixed(2)}</p>` : ''}
        
        <!-- Pulsante per aprire/chiudere i colori -->
        <button class="color-toggle" data-id="${item.id}" onclick="event.stopPropagation(); toggleColors(${item.id})">
          🎨 Scegli colori <i class="fas fa-chevron-down"></i>
        </button>
        
        <!-- Lista colori (chiusa all'avvio) -->
        <div class="color-list" data-id="${item.id}" onclick="event.stopPropagation();">
          <label class="${colors.includes('Bianco') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Bianco" ${colors.includes('Bianco') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#ffffff;"></span> Bianco
          </label>
          <label class="${colors.includes('Marmo') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Marmo" ${colors.includes('Marmo') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#E7E9EA;border-color:#ccc;"></span> Marmo
          </label>
          <label class="${colors.includes('Beige') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Beige" ${colors.includes('Beige') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#F5F5DC;"></span> Beige
          </label>
          <label class="${colors.includes('Giallo') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Giallo" ${colors.includes('Giallo') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#f1c40f;"></span> Giallo
          </label>
          <label class="${colors.includes('Arancione') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Arancione" ${colors.includes('Arancione') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#e67e22;"></span> Arancione
          </label>
          <label class="${colors.includes('Rosa') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Rosa" ${colors.includes('Rosa') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#fd79a8;"></span> Rosa
          </label>
          <label class="${colors.includes('Rosso') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Rosso" ${colors.includes('Rosso') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#e74c3c;"></span> Rosso
          </label>
          <label class="${colors.includes('Viola') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Viola" ${colors.includes('Viola') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#9b59b6;"></span> Viola
          </label>
          <label class="${colors.includes('Verde Acqua') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Verde Acqua" ${colors.includes('Verde Acqua') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#1abc9c;"></span> Verde Acqua
          </label>
          <label class="${colors.includes('Verde') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Verde" ${colors.includes('Verde') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#27ae60;"></span> Verde
          </label>
          <label class="${colors.includes('Azzurro') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Azzurro" ${colors.includes('Azzurro') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#3498db;"></span> Azzurro
          </label>
          <label class="${colors.includes('Blu') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Blu" ${colors.includes('Blu') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#2980b9;"></span> Blu
          </label>
          <label class="${colors.includes('Grigio') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Grigio" ${colors.includes('Grigio') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#95a5a6;"></span> Grigio
          </label>
          <label class="${colors.includes('Marrone') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Marrone" ${colors.includes('Marrone') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#8B4513;"></span> Marrone
          </label>
          <label class="${colors.includes('Nero') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Nero" ${colors.includes('Nero') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#000000;"></span> Nero
          </label>
          <label class="${colors.includes('Oro') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Oro" ${colors.includes('Oro') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#FFD700;"></span> Oro
          </label>
          <label class="${colors.includes('Argento') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Argento" ${colors.includes('Argento') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#C0C0C0;"></span> Argento
          </label>
          <label class="${colors.includes('Bronzo') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Bronzo" ${colors.includes('Bronzo') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#CD7F32;"></span> Bronzo
          </label>
          <label class="${colors.includes('Bianco TPU') ? 'selected' : ''}">
            <input type="checkbox" class="color-checkbox" data-id="${item.id}" value="Bianco TPU" ${colors.includes('Bianco TPU') ? 'checked' : ''} />
            <span class="custom-color-checkbox"></span>
            <span class="color-dot" style="background:#FFFFFF;"></span> Bianco TPU
          </label>
          <span class="color-hint">(max 2 colori)</span>
        </div>
        
        ${item.image ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}">` : ''}
      </div>
    `}).join('');

    // ----- EVENTI CHECKBOX SELEZIONE ARTICOLO (per sincronizzazione) -----
    document.querySelectorAll('.item-checkbox').forEach(cb => {
      cb.addEventListener('change', function(e) {
        e.stopPropagation();
        const card = this.closest('.card');
        if (this.checked) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
        updateSelectedCount();
      });
    });

    // ----- EVENTI CHECKBOX COLORI (massimo 2) -----
    document.querySelectorAll('.color-checkbox').forEach(cb => {
      cb.addEventListener('change', function(e) {
        e.stopPropagation();
        const itemId = parseInt(this.dataset.id);
        const isChecked = this.checked;
        
        const colorCheckboxes = document.querySelectorAll(`.color-checkbox[data-id="${itemId}"]`);
        const checkedColors = Array.from(colorCheckboxes).filter(c => c.checked);
        
        if (isChecked && checkedColors.length > 2) {
          alert('⚠️ Puoi selezionare massimo 2 colori per articolo.');
          this.checked = false;
          return;
        }
        
        const label = this.closest('label');
        if (this.checked) {
          label.classList.add('selected');
        } else {
          label.classList.remove('selected');
        }
        
        saveColors(itemId);
      });
    });

    updateSelectedCount();
  }

  // ============================================================
  // CONTATORE ARTICOLI SELEZIONATI
  // ============================================================
  function updateSelectedCount() {
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    const countEl = document.getElementById('selectedCount');
    if (countEl) {
      countEl.textContent = `${checkboxes.length} articoli selezionati`;
    }
  }

  // ============================================================
  // INVIO WHATSAPP - AGGIORNATO CON I COLORI
  // ============================================================
  document.getElementById('sendWhatsAppBtn').addEventListener('click', () => {
    const phone = '393470376110';
    const checkboxes = document.querySelectorAll('.item-checkbox:checked');
    
    if (checkboxes.length === 0) {
      const message = '> *Buondì, vorrei ricevere maggiori informazioni sui vostri articoli.*\n\nPotreste gentilmente fornirmi:\n- Disponibilità\n- Tempi di consegna\n- Costi di spedizione\nBuona giornata! ';
      const encodedMessage = encodeURIComponent(message);
      const url = `https://wa.me/${phone}?text=${encodedMessage}`;
      window.open(url, '_blank');
      return;
    }

    const items = loadItems();
    const selectedItems = [];
    checkboxes.forEach(cb => {
      const id = parseInt(cb.dataset.id);
      const item = items.find(i => i.id === id);
      if (item) selectedItems.push(item);
    });

    let message = '> _*Chiedo gentilmente informazioni per questi articoli*_:\n\n';
    
    selectedItems.forEach((item) => {
      const colors = item.colors || [];
      const colorText = colors.length > 0 ? ` ${colors.join(', ')}` : '';
      
      message += `• ${item.name}${colorText}\n`;
      if (item.price) message += `• € ${Number(item.price).toFixed(2)}\n`;
      if (item.description) message += `• ${item.description}\n`;
      if (item.image) message += `• ${item.image}\n`;
      message += '\n';
    });
    
    message += 'Grazie!';

    const encodedMessage = encodeURIComponent(message);
    const url = `https://wa.me/${phone}?text=${encodedMessage}`;
    window.open(url, '_blank');
  });

  // ============================================================
  // INIZIALIZZA
  // ============================================================
  document.addEventListener('DOMContentLoaded', render);

  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) render();
  });
</script>
</body>
</html>
