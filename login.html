<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-container">
  <h2>🔑 Accedi all'area privata</h2>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Entra</button>
  </form>
  <p id="loginError" class="error"></p>
  <p><a href="index.html">← Torna alla vetrina</a></p>
</div>

<script>
  const SESSION_KEY = 'loggedIn';

  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');

    try {
      const response = await fetch('hash.json');
      if (!response.ok) throw new Error('Impossibile caricare le credenziali');
      const config = await response.json();

      const passwordHash = await hashPassword(password);

      if (username === config.username && passwordHash === config.passwordHash) {
        localStorage.setItem(SESSION_KEY, 'true');
        window.location.href = 'admin.html';
      } else {
        errorEl.textContent = '❌ Credenziali non valide';
        // Pulisce il campo password per sicurezza
        document.getElementById('password').value = '';
      }
    } catch (err) {
      errorEl.textContent = '❌ Errore di connessione, riprova più tardi';
      console.error(err);
    }
  });

  // Se già loggato, reindirizza subito all'area admin
  if (localStorage.getItem(SESSION_KEY) === 'true') {
    window.location.href = 'admin.html';
  }
</script>
</body>
</html>
